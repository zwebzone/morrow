[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morrow-memory"
version = "0.1.0"
description = "Anonymous reference implementation of recurrent-state memory training"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.57",
  "safetensors>=0.4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["morrow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

